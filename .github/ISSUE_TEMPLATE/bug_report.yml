name: Bug report
description: Something isn't working as expected (sync, matching, webapp, or otherwise)
labels: ["bug"]
body:
  - type: textarea
    id: what-ran
    attributes:
      label: What you ran
      description: The exact command and any relevant environment variables (redact secrets/API keys).
      placeholder: |
        python -m sync.main --only eso
        DATABASE_URL=postgresql:///spectra
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error/traceback if there is one.
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.11.4
    validations:
      required: true
  - type: input
    id: pg-version
    attributes:
      label: PostgreSQL / q3c version (if relevant)
      description: Leave blank if this isn't a sync/database issue.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Archive code involved, star/source_id, links, screenshots, etc.
