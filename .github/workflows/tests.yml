name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL and build q3c
        run: |
          # GitHub's ubuntu-latest image preinstalls an apt source for its
          # bundled headless Chrome -- this workflow never installs or uses
          # Chrome, but `apt-get update` still fails outright if that
          # unrelated mirror serves a bad index (observed 2026-09-09:
          # persistent Hash Sum mismatch on dl.google.com/linux/chrome-stable,
          # unrelated to this repo, survived multiple reruns ~10min apart).
          # Matched by content, not a guessed filename -- the exact file
          # (google-chrome.list not being it here) varies by runner image
          # snapshot, and grep -l/sed both no-op harmlessly if nothing
          # matches, so this is safe even once the image stops shipping it.
          sudo grep -rl 'dl\.google\.com/linux/chrome' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo sed -i '/dl\.google\.com\/linux\/chrome/d' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y postgresql build-essential git
          # postgresql-server-dev-all pulls in a postgresql-common version
          # that conflicts with the PGDG-repo postgresql-common GitHub's
          # runner images preinstall -- install the server-dev package for
          # whichever major version 'postgresql' actually resolved to instead.
          PG_MAJOR=$(psql --version | awk '{print $3}' | cut -d. -f1)
          sudo apt-get install -y "postgresql-server-dev-${PG_MAJOR}"
          # PGXS also wants the exact clang the installed Postgres was built
          # with (for the JIT bitcode side-build) -- without it, `make` fails
          # on dump.bc with "clang-19: No such file or directory".
          sudo apt-get install -y clang-19 || sudo apt-get install -y clang
          git clone --depth 1 https://github.com/segasai/q3c.git /tmp/q3c
          make -C /tmp/q3c
          sudo make -C /tmp/q3c install

      - name: Create test database
        run: |
          sudo systemctl start postgresql.service
          pg_isready --timeout=30
          sudo -u postgres psql -c "CREATE ROLE runner WITH LOGIN SUPERUSER PASSWORD 'runner';"
          sudo -u postgres createdb -O runner spectra_test
          PGPASSWORD=runner psql -h localhost -U runner -d spectra_test -f db/schema.sql

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt pytest
          # --no-deps: same reason as the Dockerfile -- mdwarf-contin's own
          # pinned numpy<2.0 conflicts with astropy/healpy's numpy>=2.0
          # above; its real runtime deps are already installed above instead.
          pip install --no-deps "mdwarf-contin @ https://github.com/imedan/mdwarf_contin/archive/refs/heads/main.tar.gz"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://runner:runner@localhost/spectra_test
        run: python -m pytest tests/ -v
